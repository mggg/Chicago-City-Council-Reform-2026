[project]
name = "chicago-city-council-reform-2026"
version = "0.1.0"
description = "Simulated Chicago City Council elections under alternative districting and voting systems (GerryChain + VoteKit)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "census>=0.8.27",
    "geopandas>=1.1.3",
    "gerrychain>=0.3.2",
    "joblib-progress>=1.0.6",
    "jsonlines>=4.0.0",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "tqdm>=4.70.1",
    "votekit>=3.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
# Scripts only, not an installable package; keeps uv from treating setup.py
# (the interactive config helper) as a build script.
package = false
